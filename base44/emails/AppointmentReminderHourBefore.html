<mjml>
  <mj-head>
    <mj-title>Reminder: Your call in 1 hour</mj-title>
    <mj-preview>Reminder from Debt Advisors of America — call in 1 hour</mj-preview>
    <mj-attributes>
      <mj-all font-family="Arial, Helvetica, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#0d1117" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#10b981" border-radius="8px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f4f4f5">
    <mj-section padding="40px 36px 12px">
      <mj-column>
        <mj-text font-size="24px" font-weight="bold" color="#0a1c42">Hello {{firstname}},</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="0 36px 24px">
      <mj-column>
        <mj-text>Just wanted to remind you of our phone appointment in 1 hour. I hope you got a chance to review our credentials from my last email. Hope you having a great day!</mj-text>
      </mj-column>
    </mj-section>
    <mj-section padding="0 36px 40px">
      <mj-column>
        <mj-raw>{{email_signature}}</mj-raw>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
