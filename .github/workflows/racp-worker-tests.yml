name: RACP gateway and verified-worker tests
on:
  push:
    branches:
      - 'fix/racp-real-worker-*'
  pull_request:
    paths:
      - 'agent-gateway/server/**'
permissions:
  contents: read
jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-gateway/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check worker.mjs
