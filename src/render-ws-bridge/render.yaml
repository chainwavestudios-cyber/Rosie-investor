# Render Blueprint for the Rosie WS Bridge (prebuilt image).
# Build & push the image to your registry, then Render deploys from the image URL.
# Docs: https://render.com/docs/websocket
services:
  - type: web
    name: rosie-ws-bridge
    # Point this at your published image, e.g. ghcr.io/<owner>/rosie-ws-bridge:latest
    image: <your-registry>/rosie-ws-bridge:latest
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_WEBHOOK_URL
        # Base44 function URL that receives events, e.g.
        # https://rosieai-investorpage.base44.app/functions/mediaStreamRelay
      - key: APP_AUTH_TOKEN
        sync: false
      - key: STREAM_AUTH_TOKEN
        sync: false
      - key: PLAY_AUTH_TOKEN
        # Dedicated credential for /play endpoint (separate from stream token)
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TTS_ENGINE
        value: "elevenlabs"
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: DEEPGRAM_TTS_VOICE
        value: "aura-2-thalia-en"
      - key: DEEPGRAM_STT_MODEL
        value: "nova-2"
      - key: NODE_ENV
        value: "production"
      - key: LOG_LEVEL
        value: "info"
      - key: HTTP_TIMEOUT_MS
        value: "15000"
      - key: PING_INTERVAL_MS
        value: "30000"